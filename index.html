<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRC Plus — 부동산·인프라 금융 리서치 아카이브</title>
<meta name="description" content="부동산·인프라 금융의 이슈, 구조, 자산군을 정리한 SRC Plus 리서치 아카이브.">
<meta name="theme-color" content="#f6f7f7">
<meta property="og:type" content="website">
<meta property="og:title" content="SRC Plus — 부동산·인프라 금융 리서치 아카이브">
<meta property="og:description" content="부동산·인프라 금융의 이슈, 구조, 자산군을 정리한 리서치 아카이브.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d3557'/%3E%3Cpath d='M9 21h14M9 16h14M9 11h8' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ── 토큰: SRC 본 홈페이지 톤이 확정되면 여기만 교체 ── */
  :root {
    --bg: #f6f7f7;
    --surface: #ffffff;
    --ink: #14181f;
    --ink-2: #444b58;
    --ink-3: #667085;
    --rule: #dde1e6;
    --rule-soft: #e9ecef;
    --accent: #1d3557;
    --accent-soft: rgba(29,53,87,0.08);
    --font-sans: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: var(--font-sans);
    --wrap: 62rem;
    --pad: 1.5rem;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-sans); line-height: 1.6;
    word-break: keep-all; overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent); color: #fff; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--pad); }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ── HEADER ── */
  .site-header { border-bottom: 1px solid var(--rule); background: var(--surface); }
  .site-header .wrap { height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: baseline; gap: 0.7rem; }
  .logo b { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
  .logo b i { font-style: normal; color: var(--accent); }
  .logo span { font-size: 0.8125rem; color: var(--ink-3); }
  .header-note { font-size: 0.8125rem; color: var(--ink-3); }

  /* ── INTRO ── */
  .intro { padding: 4rem 0 2.6rem; }
  .intro h1 {
    font-size: clamp(1.7rem, 3.6vw, 2.4rem); font-weight: 700;
    line-height: 1.3; letter-spacing: -0.03em; max-width: 30rem; text-wrap: balance;
  }
  .intro p { margin-top: 1rem; max-width: 34rem; font-size: 1rem; line-height: 1.8; color: var(--ink-2); }
  .facts { margin-top: 1.8rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1.6rem; font-size: 0.8125rem; color: var(--ink-3); }
  .facts b { color: var(--ink); font-weight: 600; margin-left: 0.25rem; }

  /* ── LATEST ── */
  .latest {
    display: block; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 4px; padding: 1.8rem 2rem 1.7rem; margin-bottom: 3rem;
    transition: border-color 0.15s;
  }
  .latest:hover { border-color: var(--accent); }
  .latest:hover .l-title { color: var(--accent); }
  .l-kicker { display: flex; gap: 0.8rem; align-items: center; font-size: 0.8125rem; color: var(--ink-3); margin-bottom: 0.9rem; }
  .l-kicker .flag { color: var(--accent); font-weight: 600; }
  .l-title { font-size: clamp(1.3rem, 2.6vw, 1.7rem); font-weight: 650; line-height: 1.4; letter-spacing: -0.02em; text-wrap: balance; transition: color 0.15s; }
  .l-topic { margin-top: 0.7rem; font-size: 0.9375rem; color: var(--ink-2); }
  .l-more { margin-top: 1.3rem; font-size: 0.875rem; font-weight: 500; color: var(--accent); }

  /* ── CONTROLS ── */
  .controls { display: flex; flex-wrap: wrap; gap: 0.8rem 1rem; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--ink); padding-bottom: 0.9rem; }
  .tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .tab {
    font: inherit; font-size: 0.9375rem; font-weight: 500; color: var(--ink-3);
    background: none; border: 0; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .tab .c { font-family: var(--font-mono); font-size: 0.75rem; margin-left: 0.3rem; opacity: 0.8; }
  .tab:hover { color: var(--ink); background: var(--accent-soft); }
  .tab[aria-pressed="true"] { color: #fff; background: var(--accent); }
  .tools { display: flex; gap: 0.5rem; align-items: center; }
  .search {
    font: inherit; font-size: 0.875rem; width: 15rem; max-width: 100%;
    padding: 0.5rem 0.8rem; border: 1px solid var(--rule); border-radius: 4px;
    background: var(--surface); color: var(--ink);
  }
  .search::placeholder { color: var(--ink-3); }
  .search:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .sort {
    font: inherit; font-size: 0.875rem; padding: 0.5rem 0.7rem; border: 1px solid var(--rule);
    border-radius: 4px; background: var(--surface); color: var(--ink-2); cursor: pointer;
  }
  .cat-desc { margin-top: 0.9rem; font-size: 0.875rem; color: var(--ink-3); min-height: 1.4em; }

  /* ── LIST ── */
  .list { list-style: none; margin-top: 0.4rem; }
  .row {
    display: grid; grid-template-columns: 5.2rem 1fr 6.5rem; gap: 0 1.4rem; align-items: baseline;
    padding: 1.3rem 0.8rem; margin: 0 -0.8rem; border-bottom: 1px solid var(--rule-soft);
    border-radius: 4px; transition: background 0.15s;
  }
  .row:hover { background: var(--surface); }
  .row:hover .r-title { color: var(--accent); }
  .r-date { font-size: 0.8125rem; color: var(--ink-3); }
  .r-title { font-size: 1.125rem; font-weight: 600; line-height: 1.5; letter-spacing: -0.015em; transition: color 0.15s; text-wrap: pretty; }
  .r-topic { margin-top: 0.25rem; font-size: 0.875rem; color: var(--ink-3); }
  .r-cat { justify-self: end; font-size: 0.8125rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: 0.45rem; }
  .r-cat::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: var(--dot, 1); }
  .r-cat[data-cat="issues"]  { --dot: 0.6; }
  .r-cat[data-cat="sectors"] { --dot: 0.3; }
  .empty { padding: 3.5rem 0; text-align: center; color: var(--ink-3); font-size: 0.9375rem; }

  .upcoming { margin-top: 2.6rem; }
  .upcoming h2 { font-size: 0.8125rem; font-weight: 600; color: var(--ink-3); margin-bottom: 0.4rem; }
  .upcoming li { list-style: none; display: flex; justify-content: space-between; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px dashed var(--rule); font-size: 0.9375rem; color: var(--ink-3); }

  /* ── FOOTER ── */
  .site-footer { margin-top: 5rem; border-top: 1px solid var(--rule); background: var(--surface); }
  .site-footer .wrap { padding-top: 2rem; padding-bottom: 2.4rem; display: grid; grid-template-columns: 1fr auto; gap: 1rem 3rem; font-size: 0.8125rem; color: var(--ink-3); line-height: 1.7; }
  .site-footer strong { color: var(--ink); font-weight: 600; }
  .foot-note { max-width: 36rem; }
  .foot-meta { text-align: right; }

  @media (max-width: 720px) {
    :root { --pad: 1.2rem; }
    .header-note { display: none; }
    .intro { padding: 2.6rem 0 2rem; }
    .latest { padding: 1.4rem 1.3rem; margin-bottom: 2.2rem; }
    .tools { width: 100%; } .search { flex: 1; width: auto; }
    .row { grid-template-columns: 1fr; gap: 0.35rem; padding: 1.1rem 0.8rem; }
    .r-date { order: 2; } .r-main { order: 1; } .r-cat { order: 3; justify-self: start; }
    .row { display: flex; flex-direction: column; }
    .site-footer .wrap { grid-template-columns: 1fr; }
    .foot-meta { text-align: left; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .anim { animation: up 0.35s cubic-bezier(0.2,0.7,0.2,1) both; }
  }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>

<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="./" aria-label="SRC Plus 홈">
      <b>SRC <i>Plus</i></b>
      <span>RE &amp; Infra Report Archive</span>
    </a>
    <span class="header-note">Beyond Land, Behold Life</span>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1>부동산·인프라 금융의 이슈를 구조부터 정리합니다</h1>
    <p>인프라, 개발사업, 도시공간, 미래기술 등 부동산·인프라 금융 관련 주제를 개념·이슈·자산군 단위로 정리해 꾸준히 쌓는 리서치 아카이브입니다.</p>
    <div class="facts" id="facts"></div>
  </section>

  <a class="latest" id="latest" hidden></a>

  <section aria-label="리포트 목록">
    <div class="controls">
      <div class="tabs" id="tabs" role="group" aria-label="카테고리"></div>
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="제목·주제 검색  ( / )" aria-label="리포트 검색" autocomplete="off">
        <select class="sort" id="sort" aria-label="정렬">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
        </select>
      </div>
    </div>
    <p class="cat-desc" id="catDesc"></p>
    <ul class="list" id="list" aria-live="polite"></ul>
    <div class="upcoming" id="upcoming" hidden></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="foot-note">
      <strong>SRC Plus</strong><br>
      SRC 스터디 참여자가 조사·작성한 리서치 자료입니다. 공개 자료를 바탕으로 구조와 쟁점을 정리한 것이며, 특정 자산에 대한 투자 권유가 아닙니다.
    </div>
    <div class="foot-meta" id="foot-meta"></div>
  </div>
</footer>

<script>
/* ══════════════════════════════════════
   DATA — 리포트 목록 (build.py가 자동 갱신 · 형식 변경 금지)
══════════════════════════════════════ */
const REPORTS = [
  // ── INSIGHTS ──
  { cat: 'insights', topic: "산업단지 구조고도화사업을 통한 데이터센터 개발 구조와 쟁점", title: "데이터센터는 왜 산업단지로 가는가 — 구조고도화사업과 임대구조의 법적 관문", date: '2026 · 09', author: 'yhlee', n: 1, href: 'reports_insights_industrial-complex-datacenter.html', published: true },
  { cat: 'insights', topic: "KB 발해인프라로 보는 상장 인프라펀드의 역할", title: "주식시장이 너무 뜨거울 때, 인프라는 왜 필요할까", date: '2026 · 06', author: 'jhahn', n: 1, href: 'reports_insights_kb-balhae.html', published: true },
  { cat: 'insights', topic: "부동산 PF 규제 변화의 세 지점", title: "PF 규제는 위험을 줄였나, 부담의 순서를 바꿨나", date: '2026 · 09', author: 'jbchoi', n: 1, href: 'reports_insights_pf-regulation-shift.html', published: true },
  { cat: 'insights', topic: "부동산 사모대출의 구조, 시장 성장과 국내 법적 프레임워크", title: "은행이 줄인 자리, 부동산 사모대출이 채우는 이유", date: '2026 · 09', author: 'jhahn', n: 1, href: 'reports_insights_private-credit.html', published: true },
  // ── ISSUES ──
  { cat: 'issues', topic: "에셋라이트", title: "에셋 라이트냐, 자산보유냐, 그것이 문제로다", date: '2026 · 06', author: 'sjahn', n: 1, href: 'reports_issues_asset-lite-revised.html', published: true },
  { cat: 'issues', topic: "에셋라이트 (2)", title: "에셋라이트와 자산 보유 사이의 선택 — 케이스 스터디", date: '2026 · 06', author: 'sjahn', n: 2, href: 'reports_issues_asset-lite-revised_2.html' },
  { cat: 'issues', topic: "건설공사비", title: "자재값은 안정됐다는데, 왜 공사비는 안 떨어질까", date: '2026 · 10', author: 'tmdqor4', n: 1, href: 'reports_issues_construction-costs-stay-high-despite-stable-materials.html', published: true },
  { cat: 'issues', topic: "2026 북중미 월드컵과 인프라 금융", title: "월드컵 개최 모델은 어떻게 분산되고 있는가", date: '2025 · 06', author: 'jbchoi', n: 1, href: 'reports_issues_worldcup-infra.html' },
  // ── SECTORS ──
  { cat: 'sectors', topic: "공유수면매립사업", title: "공공의 바다를 누군가의 땅으로", date: '2025 · 06', author: 'jbchoi', n: 1, href: 'reports_sectors_land-reclamation.html', published: true },
  { cat: 'sectors', topic: "MFC(마이크로 풀필먼트센터)", title: "MFC — 리테일 매장은 어떻게 도심형 물류거점이 되는가", date: '2026 · 07', author: 'sjahn', n: 1, href: 'reports_sectors_micro-fulfillment-center_final.html', published: true },
  { cat: 'sectors', topic: "리테일 디벨로퍼", title: "한·미·일 리테일 디벨로퍼 비교 및 한국의 과제", date: '2026 · 09', author: 'minimanimo_design', n: 1, href: 'reports_sectors_retail-developer.html', published: true },
  { cat: 'sectors', topic: "해저 통신케이블 인프라", title: "해저 통신케이블은 어떻게 투자자산이 되는가", date: '2026 · 07', author: 'jbchoi', n: 1, href: 'reports_sectors_submarine-cable.html', published: true },
];

const CAT_META = {
  insights: { label: 'Insights', sub: '개념·구조 해설' },
  issues:   { label: 'Issues',   sub: '시장·정책·딜 이슈' },
  sectors:  { label: 'Sectors',  sub: '자산군·산업군 정리' },
};
const CAT_ORDER = ['insights', 'issues', 'sectors'];
const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pub = REPORTS.filter(r => r.published);
const cmpNew = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.n - a.n);

const params = new URLSearchParams(location.search);
const state = {
  cat: CAT_ORDER.includes(params.get('cat')) ? params.get('cat') : 'all',
  q: params.get('q') || '',
  sort: params.get('sort') === 'oldest' ? 'oldest' : 'newest',
};

function syncUrl() {
  const p = new URLSearchParams();
  if (state.cat !== 'all') p.set('cat', state.cat);
  if (state.q) p.set('q', state.q);
  if (state.sort !== 'newest') p.set('sort', state.sort);
  const s = p.toString();
  try { history.replaceState(null, '', s ? '?' + s : location.pathname); } catch (e) {}
}

function renderStatic() {
  const newest = [...pub].sort(cmpNew)[0];
  $('facts').innerHTML =
    `<span>게시된 리포트<b class="num">${pub.length}</b></span>` +
    CAT_ORDER.map(c => `<span>${CAT_META[c].label}<b class="num">${pub.filter(r => r.cat === c).length}</b></span>`).join('') +
    (newest ? `<span>최근 업데이트<b class="num">${esc(newest.date.replace(/ /g, ''))}</b></span>` : '');
  $('foot-meta').innerHTML = newest ? `Last updated <span class="num">${esc(newest.date.replace(/ /g, ''))}</span><br>Beyond Land, Behold Life` : 'Beyond Land, Behold Life';

  if (newest) {
    const el = $('latest');
    el.hidden = false; el.href = newest.href;
    el.innerHTML = `
      <div class="l-kicker"><span class="flag">최신 리포트</span><span>${CAT_META[newest.cat].label}</span><span class="num">${esc(newest.date)}</span></div>
      <div class="l-title">${esc(newest.title)}</div>
      ${newest.topic ? `<div class="l-topic">${esc(newest.topic)}</div>` : ''}
      <div class="l-more">읽어보기 →</div>`;
  }

  $('tabs').innerHTML = ['all', ...CAT_ORDER].map(c => {
    const n = c === 'all' ? pub.length : pub.filter(r => r.cat === c).length;
    return `<button class="tab" type="button" data-cat="${c}">${c === 'all' ? '전체' : CAT_META[c].label}<span class="c">${n}</span></button>`;
  }).join('');
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    state.cat = b.dataset.cat; render();
  });
}

function render() {
  const q = state.q.trim().toLowerCase();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat)));
  $('catDesc').textContent = state.cat === 'all' ? '모든 카테고리의 리포트를 시간순으로 보여줍니다.' : CAT_META[state.cat].sub;
  const match = r => (state.cat === 'all' || r.cat === state.cat) &&
    (!q || r.title.toLowerCase().includes(q) || (r.topic || '').toLowerCase().includes(q));

  const items = pub.filter(match).sort(cmpNew);
  if (state.sort === 'oldest') items.reverse();

  $('list').innerHTML = items.length ? items.map((r, i) => `
    <li><a class="row anim" href="${esc(r.href)}" style="animation-delay:${Math.min(i, 8) * 0.03}s">
      <span class="r-date num">${esc(r.date)}</span>
      <span class="r-main"><div class="r-title">${esc(r.title)}</div>${r.topic ? `<div class="r-topic">${esc(r.topic)}</div>` : ''}</span>
      <span class="r-cat" data-cat="${r.cat}">${CAT_META[r.cat].label}</span>
    </a></li>`).join('')
    : `<li class="empty">${q ? `"${esc(state.q)}"와 일치하는 리포트가 없습니다.` : '아직 게시된 리포트가 없습니다.'}</li>`;

  const up = REPORTS.filter(r => r.upcoming && match(r));
  const upEl = $('upcoming');
  upEl.hidden = !(up.length && !q);
  if (!upEl.hidden) upEl.innerHTML = `<h2>작성 예정</h2><ul>${up.map(r => `<li><span>${esc(r.title)}</span><span>Soon</span></li>`).join('')}</ul>`;
  syncUrl();
}

$('q').value = state.q; $('sort').value = state.sort;
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
});
renderStatic(); render();
</script>
</body>
</html>
